# Hypershell maintained downstream release.
# Publishes only exact versioned images to X1pheR GHCR; it deliberately does
# not claim upstream Docker Hub, latest, major, beta, dev, or CI image tags.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/x1pher/dbackup

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read
      id-token: write

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Resolve downstream version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.vendor=X1pheR
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.description=Community-maintained DBackup downstream based on Skyfay/DBackup.
          cache-from: type=gha,scope=build-${{ matrix.suffix }}
          cache-to: type=gha,scope=build-${{ matrix.suffix }},mode=max

  build-verification:
    name: Build Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Resolve downstream version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start container
        run: |
          docker run -d --name smoke \
            -e DATABASE_URL="file:/data/db/test.db" \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            -e ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -p 3000:3000 \
            "${{ env.GHCR_IMAGE }}:${{ steps.version.outputs.version }}-amd64"

      - name: Wait for healthy
        run: |
          for _ in $(seq 1 30); do
            if curl -sfk https://localhost:3000/api/health >/dev/null 2>&1 || \
               curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  manifest:
    name: Create Version Manifest
    runs-on: ubuntu-latest
    needs: build-verification
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Resolve downstream version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create exact multi-arch manifest
        run: |
          version="${{ steps.version.outputs.version }}"
          docker buildx imagetools create \
            -t "${{ env.GHCR_IMAGE }}:${version}" \
            "${{ env.GHCR_IMAGE }}:${version}-amd64" \
            "${{ env.GHCR_IMAGE }}:${version}-arm64"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: manifest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Extract downstream release notes
        run: |
          tag="${GITHUB_REF_NAME}"
          awk -v tag="^## ${tag}" '
            $0 ~ tag {flag=1; sub(/^## v[^ ]+ - /, "## "); print; next}
            /^## v[0-9]/ {if(flag) exit}
            flag && /^\*Released:/ {next}
            flag {print}
          ' docs/changelog.md > release_notes.md
          test -s release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: false