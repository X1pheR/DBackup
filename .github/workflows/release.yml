# Hypershell maintained downstream release.
# Publishes only exact versioned images to X1pheR GHCR; it deliberately does
# not claim upstream Docker Hub, latest, major, beta, dev, or CI image tags.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing exact release tag to recover.
        required: true
        type: string
      expected_sha:
        description: Exact commit SHA the release tag must resolve to.
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  GHCR_IMAGE: ghcr.io/x1pher/dbackup

jobs:
  preflight:
    name: Resolve Exact Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Verify exact release identity
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EXPECTED_SHA: ${{ inputs.expected_sha || github.sha }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-x1pher\.[0-9]+)?$ ]]
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_SHA"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$actual_sha" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate
    needs: preflight
    uses: ./.github/workflows/validate.yml
    with:
      ref: ${{ needs.preflight.outputs.tag }}
    permissions:
      contents: read
      id-token: write

  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs:
      - preflight
      - validate
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.GHCR_IMAGE }}:${{ needs.preflight.outputs.version }}-${{ matrix.suffix }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.preflight.outputs.version }}
            org.opencontainers.image.vendor=X1pheR
            org.opencontainers.image.licenses=GPL-3.0-only
            org.opencontainers.image.description=Community-maintained DBackup downstream based on Skyfay/DBackup.
          cache-from: type=gha,scope=build-${{ matrix.suffix }}
          cache-to: type=gha,scope=build-${{ matrix.suffix }},mode=max

  build-verification:
    name: Build Test
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start container
        run: |
          docker run -d --name smoke \
            -e DATABASE_URL="file:/data/db/test.db" \
            -e BETTER_AUTH_SECRET="$(openssl rand -base64 32)" \
            -e ENCRYPTION_KEY="$(openssl rand -hex 32)" \
            -p 3000:3000 \
            "${{ env.GHCR_IMAGE }}:${{ needs.preflight.outputs.version }}-amd64"

      - name: Wait for healthy
        run: |
          for _ in $(seq 1 30); do
            if curl -sfk https://localhost:3000/api/health >/dev/null 2>&1 || \
               curl -sf http://localhost:3000/api/health >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs smoke
          exit 1

      - name: Cleanup
        if: always()
        run: docker rm -f smoke || true

  manifest:
    name: Create Version Manifest
    runs-on: ubuntu-latest
    needs:
      - preflight
      - build-verification
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create exact multi-arch manifest
        run: |
          version="${{ needs.preflight.outputs.version }}"
          docker buildx imagetools create \
            -t "${{ env.GHCR_IMAGE }}:${version}" \
            "${{ env.GHCR_IMAGE }}:${version}-amd64" \
            "${{ env.GHCR_IMAGE }}:${version}-arm64"

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - preflight
      - manifest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.tag }}

      - name: Extract downstream release notes
        run: |
          tag="${{ needs.preflight.outputs.tag }}"
          awk -v tag="^## ${tag}" '
            $0 ~ tag {flag=1; sub(/^## v[^ ]+ - /, "## "); print; next}
            /^## v[0-9]/ {if(flag) exit}
            flag && /^\*Released:/ {next}
            flag {print}
          ' docs/changelog.md > release_notes.md
          test -s release_notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: false